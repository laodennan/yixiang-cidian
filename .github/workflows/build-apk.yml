name: Build APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # NOTE: do NOT use android-actions/setup-android here — it tries to install
      # the obsolete "tools" package that Google removed, which fails the build.
      # GitHub-hosted ubuntu runners already ship an Android SDK (ANDROID_HOME
      # is preset with cmdline-tools, platform-tools, build-tools and platforms),
      # so Gradle finds it automatically.
      - name: Confirm preinstalled Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yixiang-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
